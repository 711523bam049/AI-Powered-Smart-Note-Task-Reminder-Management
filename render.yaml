services:
  # 1. Backend API Service
  - type: web
    name: smart-capture-api
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt && python database/init_db.py"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: MODEL_WEIGHTS_DIR
        value: "./ml_weights"
      - key: DATABASE_URL
        value: "sqlite:///./smart_capture.db"
